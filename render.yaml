# Render Blueprint — provisions both services from one file.
# Render Dashboard → New → Blueprint → pick this repo.
#
# Values marked `sync: false` are not stored here; Render prompts for them
# during setup so no secret ever lands in git.

services:
  - type: web
    name: hiremind-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # gunicorn binds 0.0.0.0:$PORT on its own when PORT is set, which Render does.
    startCommand: gunicorn --chdir api app:app
    envVars:
      - key: MODEL_PROVIDER
        value: groq
      - key: LLM_MODEL
        # Check console.groq.com for the current list — model names change.
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        # Set to the static site's URL once it exists.
        sync: false

  - type: web
    name: hiremind-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        # Baked in at BUILD time — changing it needs a redeploy, not a restart.
        sync: false
    routes:
      # vue-router uses history mode, so /interview and /summary are client-side
      # paths with no file behind them. Without this rewrite every deep link and
      # every page refresh returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
